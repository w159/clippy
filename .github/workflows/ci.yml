name: CI

# The gate that has to be green before a release is cut.
#
# It exists because Clippy cannot be built on a machine that only has the Command
# Line Tools: SwiftUI's @State and Foundation Models' @Generable are external
# macros whose plugins ship with Xcode, so `swift build` fails locally with
# "plugin for module 'SwiftUIMacros' not found". The release workflow already
# runs `swift test` on macos-26, but only while cutting a release - which is too
# late to find out. This runs the same checks on every push.

on:
    push:
        branches: ["**"]
        tags-ignore: ["v*"] # the release workflow covers tags
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    swift:
        name: Swift build and tests
        runs-on: macos-26
        steps:
            - uses: actions/checkout@v6.0.3

            - name: Show toolchain
              run: |
                  swift --version
                  xcodebuild -version
                  sw_vers

            # The job log viewer keeps only the tail and the compiler repeats each
            # error once per file, so print the distinct errors last (and as
            # annotations) where they cannot be cut off.
            - name: Build
              run: |
                  set -o pipefail
                  status=0
                  swift build 2>&1 | tee "$RUNNER_TEMP/swift-build.log" || status=$?
                  grep -E ': error: ' "$RUNNER_TEMP/swift-build.log" | sort -u | head -100 || true
                  grep -E ': error: ' "$RUNNER_TEMP/swift-build.log" | sort -u | head -10 | while IFS= read -r line; do echo "::error::$line"; done || true
                  exit $status

            # Tee the output so the XCTest totals are printed as their own line:
            # the swift-testing summary at the end only counts swift-testing tests.
            - name: Test
              run: |
                  set -o pipefail
                  status=0
                  swift test 2>&1 | tee "$RUNNER_TEMP/swift-test.log" || status=$?
                  echo "::notice title=XCTest totals::$(grep -E 'Executed [0-9]+ tests' "$RUNNER_TEMP/swift-test.log" | tail -1)"
                  grep -E ': error: ' "$RUNNER_TEMP/swift-test.log" | sort -u | head -100 || true
                  grep -E ': error: ' "$RUNNER_TEMP/swift-test.log" | sort -u | head -10 | while IFS= read -r line; do echo "::error::$line"; done || true
                  exit $status

            - name: Perf numbers
              if: always()
              run: |
                  grep -E 'PERF ' "$RUNNER_TEMP/swift-test.log" | sort -u | while IFS= read -r line; do echo "::notice title=Perf::$line"; done || true

    app:
        name: App bundle, UI harness and screenshots
        runs-on: macos-26
        steps:
            - uses: actions/checkout@v6.0.3

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"

            # Drives the real panel in a real window with real key and mouse
            # events (PanelHarnessTests, SettingsKeyboardHarnessTests): search, Return mid-typing, typing from
            # the list, no results; and saves light and dark screenshots of the
            # panel, Settings and onboarding.
            - name: UI harness
              env:
                  CLIPPY_UI_HARNESS: "1"
                  CLIPPY_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
              run: |
                  set -o pipefail
                  status=0
                  swift test --filter 'PanelHarnessTests|SettingsKeyboardHarnessTests' 2>&1 | tee "$RUNNER_TEMP/harness.log" || status=$?
                  grep -E 'Executed [0-9]+ tests' "$RUNNER_TEMP/harness.log" | tail -1 || true
                  grep -E ': error: ' "$RUNNER_TEMP/harness.log" | sort -u | head -100 || true
                  grep -E ': error: ' "$RUNNER_TEMP/harness.log" | sort -u | head -10 | while IFS= read -r line; do echo "::error::$line"; done || true
                  exit $status

            - name: Build Clippy.app
              run: scripts/make-app.sh 0.0.0-ci

            # The bundle must launch and stay up; a crash on start fails here.
            - name: Launch smoke test
              run: |
                  mkdir -p "$RUNNER_TEMP/screenshots"
                  open build/Clippy.app
                  sleep 8
                  pgrep -x Clippy
                  /usr/sbin/screencapture -x "$RUNNER_TEMP/screenshots/09-first-launch.png" || true
                  pkill -x Clippy || true

            - name: Upload screenshots
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: clippy-screenshots
                  path: ${{ runner.temp }}/screenshots
                  if-no-files-found: warn

            # The same screenshots tiled into one unzipped PNG, so a reviewer can
            # open a single image from the run page instead of unpacking a zip.
            - name: Contact sheet
              if: always()
              run: |
                  cat > "$RUNNER_TEMP/sheet.swift" <<'SWIFT'
                  import AppKit
                  let args = CommandLine.arguments
                  let dir = URL(fileURLWithPath: args[1]), out = URL(fileURLWithPath: args[2])
                  let files = ((try? FileManager.default.contentsOfDirectory(at: dir, includingPropertiesForKeys: nil)) ?? [])
                      .filter { $0.pathExtension == "png" }
                      .sorted { $0.lastPathComponent < $1.lastPathComponent }
                  let cellW: CGFloat = 900, labelH: CGFloat = 30, pad: CGFloat = 16, cols = 2
                  var cells: [(name: String, image: NSImage, height: CGFloat)] = []
                  for file in files {
                      guard let image = NSImage(contentsOf: file), image.size.width > 0 else { continue }
                      cells.append((file.lastPathComponent, image, cellW * image.size.height / image.size.width))
                  }
                  let rows = stride(from: 0, to: cells.count, by: cols).map { Array(cells[$0..<min($0 + cols, cells.count)]) }
                  let rowHeights = rows.map { ($0.map(\.height).max() ?? 0) + labelH + pad }
                  let width = CGFloat(cols) * (cellW + pad) + pad
                  let height = rowHeights.reduce(pad, +)
                  guard let rep = NSBitmapImageRep(bitmapDataPlanes: nil, pixelsWide: Int(width), pixelsHigh: Int(height),
                                                   bitsPerSample: 8, samplesPerPixel: 4, hasAlpha: true, isPlanar: false,
                                                   colorSpaceName: .deviceRGB, bytesPerRow: 0, bitsPerPixel: 0) else { exit(1) }
                  NSGraphicsContext.saveGraphicsState()
                  NSGraphicsContext.current = NSGraphicsContext(bitmapImageRep: rep)
                  // Mid grey so the edges of light and dark windows both show.
                  NSColor(white: 0.5, alpha: 1).setFill()
                  NSRect(x: 0, y: 0, width: width, height: height).fill()
                  var top = height - pad
                  for (index, row) in rows.enumerated() {
                      for (column, cell) in row.enumerated() {
                          let x = pad + CGFloat(column) * (cellW + pad)
                          (cell.name as NSString).draw(at: NSPoint(x: x, y: top - labelH + 6), withAttributes: [
                              .font: NSFont.boldSystemFont(ofSize: 18), .foregroundColor: NSColor.white])
                          cell.image.draw(in: NSRect(x: x, y: top - labelH - cell.height, width: cellW, height: cell.height))
                      }
                      top -= rowHeights[index]
                  }
                  NSGraphicsContext.restoreGraphicsState()
                  try rep.representation(using: .png, properties: [:])!.write(to: out)
                  print("contact sheet: \(cells.count) screenshots, \(Int(width))x\(Int(height))")
                  SWIFT
                  swift "$RUNNER_TEMP/sheet.swift" "$RUNNER_TEMP/screenshots" "$RUNNER_TEMP/clippy-contact-sheet.png"

            - name: Upload contact sheet
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  path: ${{ runner.temp }}/clippy-contact-sheet.png
                  archive: false
                  if-no-files-found: warn

    # The panel as it looked in 2.2.0 (b8aa9a0) next to this commit, on one image.
    # 2.2.0 has no UI harness, so ci/before-2.2.0/BeforeScreenshotTests.swift is
    # dropped into a checkout of it. Nothing depends on this job, and it never
    # fails the run (continue-on-error): it is a reviewer's aid, not a gate.
    before-after:
        name: Before and after screenshots
        needs: app
        if: ${{ !cancelled() }}
        continue-on-error: true
        runs-on: macos-26
        steps:
            - uses: actions/checkout@v6.0.3

            - uses: actions/checkout@v6.0.3
              with:
                  ref: b8aa9a0d9b375f490deb937c0ee420fba2ddfb89
                  path: before

            - name: Render the 2.2.0 panel
              env:
                  CLIPPY_UI_HARNESS: "1"
                  CLIPPY_SCREENSHOT_DIR: ${{ runner.temp }}/before-shots
              run: |
                  cp ci/before-2.2.0/BeforeScreenshotTests.swift before/Tests/ClippyTests/
                  cd before
                  swift test --filter BeforeScreenshotTests
                  ls -l "$CLIPPY_SCREENSHOT_DIR"

            - name: Download current screenshots
              uses: actions/download-artifact@v8
              with:
                  name: clippy-screenshots
                  path: ${{ runner.temp }}/screenshots

            # Left: 2.2.0. Right: this commit's main panel, preferring
            # panel-history-detail over 01-panel-light.
            - name: Compose before and after
              run: |
                  cat > "$RUNNER_TEMP/compose.swift" <<'SWIFT'
                  import AppKit
                  let args = CommandLine.arguments
                  let beforeURL = URL(fileURLWithPath: args[1]), shots = URL(fileURLWithPath: args[2])
                  let out = URL(fileURLWithPath: args[3])
                  let afterURL = ["panel-history-detail.png", "01-panel-light.png"]
                      .map { shots.appendingPathComponent($0) }
                      .first { FileManager.default.fileExists(atPath: $0.path) }
                  guard let afterURL, let before = NSImage(contentsOf: beforeURL), let after = NSImage(contentsOf: afterURL),
                        before.size.width > 0, after.size.width > 0 else { print("missing input image"); exit(1) }
                  func pixelSize(_ image: NSImage) -> CGSize {
                      if let rep = image.representations.first, rep.pixelsWide > 0, rep.pixelsHigh > 0 {
                          return CGSize(width: rep.pixelsWide, height: rep.pixelsHigh)
                      }
                      return image.size
                  }
                  // Both images are drawn at one shared scale (never upscaled), top-aligned, so a larger panel looks larger.
                  let labelH: CGFloat = 44, pad: CGFloat = 16, maxCellW: CGFloat = 1100
                  let cells: [(String, NSImage, CGSize)] = [
                      ("2.2.0 (default 640x480)", before, pixelSize(before)),
                      ("Now (default 920x560)", after, pixelSize(after))]
                  let scale = min(1, maxCellW / (cells.map { $0.2.width }.max() ?? 1))
                  let drawn = cells.map { CGSize(width: $0.2.width * scale, height: $0.2.height * scale) }
                  let width = drawn.reduce(pad) { $0 + $1.width + pad }
                  let height = (drawn.map(\.height).max() ?? 0) + labelH + 2 * pad
                  guard let rep = NSBitmapImageRep(bitmapDataPlanes: nil, pixelsWide: Int(width), pixelsHigh: Int(height),
                                                   bitsPerSample: 8, samplesPerPixel: 4, hasAlpha: true, isPlanar: false,
                                                   colorSpaceName: .deviceRGB, bytesPerRow: 0, bitsPerPixel: 0) else { exit(1) }
                  NSGraphicsContext.saveGraphicsState()
                  NSGraphicsContext.current = NSGraphicsContext(bitmapImageRep: rep)
                  NSColor(white: 0.5, alpha: 1).setFill()
                  NSRect(x: 0, y: 0, width: width, height: height).fill()
                  let top = height - pad
                  var x = pad
                  for (index, cell) in cells.enumerated() {
                      let size = drawn[index]
                      (cell.0 as NSString).draw(at: NSPoint(x: x, y: top - labelH + 8), withAttributes: [
                          .font: NSFont.boldSystemFont(ofSize: 28), .foregroundColor: NSColor.white])
                      cell.1.draw(in: NSRect(x: x, y: top - labelH - size.height, width: size.width, height: size.height))
                      x += size.width + pad
                  }
                  NSGraphicsContext.restoreGraphicsState()
                  try rep.representation(using: .png, properties: [:])!.write(to: out)
                  print("before-after: \(beforeURL.lastPathComponent) | \(afterURL.lastPathComponent), \(Int(width))x\(Int(height))")
                  SWIFT
                  swift "$RUNNER_TEMP/compose.swift" "$RUNNER_TEMP/before-shots/before-panel-history.png" \
                      "$RUNNER_TEMP/screenshots" "$RUNNER_TEMP/clippy-before-after.png"

            - name: Upload before and after
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  path: ${{ runner.temp }}/clippy-before-after.png
                  archive: false
                  if-no-files-found: warn

    mcp:
        name: MCP server
        runs-on: macos-26
        steps:
            - uses: actions/checkout@v6.0.3

            # node:sqlite is unflagged from 22.13, which the server depends on.
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Typecheck and smoke-test
              run: |
                  cd integrations/clippy-mcp
                  npm ci --no-audit --no-fund
                  npm run typecheck
                  npm test

            # The plugin ships a vendored copy of the built server. If it drifts
            # from src/, users of the plugin run stale code - which is exactly how
            # the openApi3 schema bug stayed live after being fixed in source.
            #
            # Compared by tool contract rather than by bytes: esbuild embeds each
            # bundled module's resolved path as a comment, so a checkout whose
            # node_modules is a symlink produces a byte-different but identical
            # bundle. See test/bundle-parity.mjs.
            - name: Vendored plugin bundle is in sync
              run: |
                  cd integrations/clippy-mcp
                  node test/bundle-parity.mjs
