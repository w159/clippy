name: CI

# The gate that has to be green before a release is cut.
#
# It exists because Clippy cannot be built on a machine that only has the Command
# Line Tools: SwiftUI's @State and Foundation Models' @Generable are external
# macros whose plugins ship with Xcode, so `swift build` fails locally with
# "plugin for module 'SwiftUIMacros' not found". The release workflow already
# runs `swift test` on macos-26, but only while cutting a release - which is too
# late to find out. This runs the same checks on every push.

on:
    push:
        branches: ["**"]
        tags-ignore: ["v*"] # the release workflow covers tags
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    swift:
        name: Swift build and tests
        runs-on: macos-26
        steps:
            - uses: actions/checkout@v6.0.3

            - name: Show toolchain
              run: |
                  swift --version
                  xcodebuild -version
                  sw_vers

            # The job log viewer keeps only the tail and the compiler repeats each
            # error once per file, so print the distinct errors last (and as
            # annotations) where they cannot be cut off.
            - name: Build
              run: |
                  set -o pipefail
                  status=0
                  swift build 2>&1 | tee "$RUNNER_TEMP/swift-build.log" || status=$?
                  grep -E ': error: ' "$RUNNER_TEMP/swift-build.log" | sort -u | head -100 || true
                  grep -E ': error: ' "$RUNNER_TEMP/swift-build.log" | sort -u | head -10 | while IFS= read -r line; do echo "::error::$line"; done || true
                  exit $status

            # Tee the output so the XCTest totals are printed as their own line:
            # the swift-testing summary at the end only counts swift-testing tests.
            - name: Test
              run: |
                  set -o pipefail
                  status=0
                  swift test 2>&1 | tee "$RUNNER_TEMP/swift-test.log" || status=$?
                  echo "::notice title=XCTest totals::$(grep -E 'Executed [0-9]+ tests' "$RUNNER_TEMP/swift-test.log" | tail -1)"
                  grep -E ': error: ' "$RUNNER_TEMP/swift-test.log" | sort -u | head -100 || true
                  grep -E ': error: ' "$RUNNER_TEMP/swift-test.log" | sort -u | head -10 | while IFS= read -r line; do echo "::error::$line"; done || true
                  exit $status

            - name: Perf numbers
              if: always()
              run: |
                  grep -E 'PERF ' "$RUNNER_TEMP/swift-test.log" | sort -u | while IFS= read -r line; do echo "::notice title=Perf::$line"; done || true

    app:
        name: App bundle, UI harness and screenshots
        runs-on: macos-26
        steps:
            - uses: actions/checkout@v6.0.3

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"

            # Drives the real panel in a real window with real key and mouse
            # events (PanelHarnessTests, SettingsKeyboardHarnessTests): search, Return mid-typing, typing from
            # the list, no results; and saves light and dark screenshots of the
            # panel, Settings and onboarding.
            - name: UI harness
              env:
                  CLIPPY_UI_HARNESS: "1"
                  CLIPPY_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
              run: |
                  set -o pipefail
                  status=0
                  swift test --filter 'PanelHarnessTests|SettingsKeyboardHarnessTests' 2>&1 | tee "$RUNNER_TEMP/harness.log" || status=$?
                  grep -E 'Executed [0-9]+ tests' "$RUNNER_TEMP/harness.log" | tail -1 || true
                  echo "capture=window: $(grep -c '^capture=window' "$RUNNER_TEMP/harness.log" || true)"
                  echo "capture=cache: $(grep -c '^capture=cache' "$RUNNER_TEMP/harness.log" || true)"
                  grep -E ': error: ' "$RUNNER_TEMP/harness.log" | sort -u | head -100 || true
                  grep -E ': error: ' "$RUNNER_TEMP/harness.log" | sort -u | head -10 | while IFS= read -r line; do echo "::error::$line"; done || true
                  exit $status

            # Sizes in points measured on the real laid-out panel, Settings and onboarding windows
            # (PanelHarnessTests+Measure.swift). The test also writes measurements.txt into the
            # screenshot folder, which the clippy-screenshots artifact carries.
            - name: Measurements
              if: always()
              run: |
                  grep -E '^MEASURE ' "$RUNNER_TEMP/harness.log" | awk '!seen[$0]++' | tee "$RUNNER_TEMP/measure-log.txt" || true
                  if [ ! -s "$RUNNER_TEMP/screenshots/measurements.txt" ]; then echo "::warning::measurements.txt was not written"; fi
                  { echo '### Measurements (points)'; echo '```'; cat "$RUNNER_TEMP/measure-log.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true

            - name: Build Clippy.app
              run: scripts/make-app.sh 0.0.0-ci

            # The bundle must launch and stay up; a crash on start fails here.
            - name: Launch smoke test
              run: |
                  mkdir -p "$RUNNER_TEMP/screenshots"
                  open build/Clippy.app
                  sleep 8
                  open build/Clippy.app
                  sleep 2
                  pgrep -x Clippy
                  /usr/sbin/screencapture -x "$RUNNER_TEMP/screenshots/09-first-launch.png" || true
                  pkill -x Clippy || true

            - name: Upload screenshots
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: clippy-screenshots
                  path: ${{ runner.temp }}/screenshots
                  if-no-files-found: warn

            # The same screenshots tiled into one unzipped PNG, so a reviewer can
            # open a single image from the run page instead of unpacking a zip.
            - name: Contact sheet
              if: always()
              run: |
                  cat > "$RUNNER_TEMP/sheet.swift" <<'SWIFT'
                  import AppKit
                  let args = CommandLine.arguments
                  let dir = URL(fileURLWithPath: args[1]), out = URL(fileURLWithPath: args[2])
                  let files = ((try? FileManager.default.contentsOfDirectory(at: dir, includingPropertiesForKeys: nil)) ?? [])
                      .filter { $0.pathExtension == "png" }
                      .sorted { $0.lastPathComponent < $1.lastPathComponent }
                  let cellW: CGFloat = 900, labelH: CGFloat = 30, pad: CGFloat = 16, cols = 2
                  var cells: [(name: String, image: NSImage, height: CGFloat)] = []
                  for file in files {
                      guard let image = NSImage(contentsOf: file), image.size.width > 0 else { continue }
                      cells.append((file.lastPathComponent, image, cellW * image.size.height / image.size.width))
                  }
                  let rows = stride(from: 0, to: cells.count, by: cols).map { Array(cells[$0..<min($0 + cols, cells.count)]) }
                  let rowHeights = rows.map { ($0.map(\.height).max() ?? 0) + labelH + pad }
                  let width = CGFloat(cols) * (cellW + pad) + pad
                  let height = rowHeights.reduce(pad, +)
                  guard let rep = NSBitmapImageRep(bitmapDataPlanes: nil, pixelsWide: Int(width), pixelsHigh: Int(height),
                                                   bitsPerSample: 8, samplesPerPixel: 4, hasAlpha: true, isPlanar: false,
                                                   colorSpaceName: .deviceRGB, bytesPerRow: 0, bitsPerPixel: 0) else { exit(1) }
                  NSGraphicsContext.saveGraphicsState()
                  NSGraphicsContext.current = NSGraphicsContext(bitmapImageRep: rep)
                  // Mid grey so the edges of light and dark windows both show.
                  NSColor(white: 0.5, alpha: 1).setFill()
                  NSRect(x: 0, y: 0, width: width, height: height).fill()
                  var top = height - pad
                  for (index, row) in rows.enumerated() {
                      for (column, cell) in row.enumerated() {
                          let x = pad + CGFloat(column) * (cellW + pad)
                          (cell.name as NSString).draw(at: NSPoint(x: x, y: top - labelH + 6), withAttributes: [
                              .font: NSFont.boldSystemFont(ofSize: 18), .foregroundColor: NSColor.white])
                          cell.image.draw(in: NSRect(x: x, y: top - labelH - cell.height, width: cellW, height: cell.height))
                      }
                      top -= rowHeights[index]
                  }
                  NSGraphicsContext.restoreGraphicsState()
                  try rep.representation(using: .png, properties: [:])!.write(to: out)
                  print("contact sheet: \(cells.count) screenshots, \(Int(width))x\(Int(height))")
                  SWIFT
                  swift "$RUNNER_TEMP/sheet.swift" "$RUNNER_TEMP/screenshots" "$RUNNER_TEMP/clippy-contact-sheet.png"

            - name: Upload contact sheet
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  path: ${{ runner.temp }}/clippy-contact-sheet.png
                  archive: false
                  if-no-files-found: warn

    # Every screen of Clippy 2.2.0 (b8aa9a0), 2.4.0 (f1c1035, tag v2.4.0) and this
    # commit side by side, light and dark, at actual size, so the redesign can be
    # judged at a glance. This commit's shots are the app job's clippy-screenshots
    # artifact. 2.4.0 has the same UI harness, so its own tests run unchanged and
    # already shoot dark. 2.2.0 has no harness: ci/before-2.2.0/BeforeScreenshotTests.swift
    # is dropped into its checkout. ci/compare/compose.py maps each version's file
    # names to one screen key and tiles them. Nothing depends on this job and it
    # never fails the run (continue-on-error): it is a reviewer's aid, not a gate.
    compare:
        name: Version comparison
        needs: app
        if: ${{ !cancelled() }}
        continue-on-error: true
        runs-on: macos-26
        steps:
            - uses: actions/checkout@v6.0.3

            - uses: actions/checkout@v6.0.3
              with:
                  ref: f1c1035e83a984dfa10beb03e99a0752e1f1b73a # tag v2.4.0
                  path: v240

            - uses: actions/checkout@v6.0.3
              with:
                  ref: b8aa9a0d9b375f490deb937c0ee420fba2ddfb89
                  path: v220

            # The screenshot tests that exist at v2.4.0 (PanelHarnessTests and its
            # +Screens extension); testKeyboardOnlyJourneys is left out, it takes
            # no screenshots. A test that fails still leaves the shots it took.
            - name: Render the 2.4.0 screens
              env:
                  CLIPPY_UI_HARNESS: "1"
                  CLIPPY_SCREENSHOT_DIR: ${{ runner.temp }}/v240-shots
              run: |
                  cd v240
                  swift test --filter 'PanelHarnessTests/test(SearchFlowsInTheRealPanel|DarkPanelScreenshots|SettingsAndOnboardingScreenshots|SettingsPaneScreenshots|PanelPaneScreenshots|EditorAndSheetScreenshots|EmptyAndErrorStateScreenshots)' || echo "::warning::2.4.0 screenshot tests reported failures"
                  ls "$CLIPPY_SCREENSHOT_DIR" | wc -l

            # 2.4.0's panel at its own default size (920x560). Its harness opens the panel
            # at a fixed 1000x620, so openPanel is opened up to take a size and one extra
            # test (ci/before-2.4.0) shoots the default-size panel.
            - name: Render the 2.4.0 default-size panel
              env:
                  CLIPPY_UI_HARNESS: "1"
                  CLIPPY_SCREENSHOT_DIR: ${{ runner.temp }}/v240-shots
              run: |
                  cp ci/before-2.4.0/DefaultSizeScreenshotTests.swift v240/Tests/ClippyTests/
                  cd v240
                  sed -i.bak \
                      -e 's|private func openPanel(appearance: NSAppearance.Name) throws {|func openPanel(appearance: NSAppearance.Name, size: NSSize = NSSize(width: 1000, height: 620)) throws {|' \
                      -e 's|show(view.clippyDesignSystem(), size: NSSize(width: 1000, height: 620), appearance: appearance, panelChrome: true)|show(view.clippyDesignSystem(), size: size, appearance: appearance, panelChrome: true)|' \
                      Tests/ClippyTests/PanelHarnessTests.swift
                  rm -f Tests/ClippyTests/PanelHarnessTests.swift.bak
                  grep -c 'size: size, appearance: appearance, panelChrome: true' Tests/ClippyTests/PanelHarnessTests.swift
                  swift test --filter 'PanelHarnessTests/testDefaultSizePanelScreenshots' || echo "::warning::2.4.0 default-size panel test reported failures"
                  ls "$CLIPPY_SCREENSHOT_DIR" | grep -c '50-panel-default' || true

            - name: Render the 2.2.0 screens
              env:
                  CLIPPY_UI_HARNESS: "1"
                  CLIPPY_SCREENSHOT_DIR: ${{ runner.temp }}/v220-shots
              run: |
                  cp ci/before-2.2.0/BeforeScreenshotTests.swift v220/Tests/ClippyTests/
                  cd v220
                  # One process per test: 2.2.0's onboarding view model calls
                  # UNUserNotificationCenter.current(), which raises an
                  # NSInternalInconsistencyException without an app bundle and would kill
                  # every other test. testOnboardingScreenshots is skipped for 2.2.0 (the
                  # comparison then shows the placeholder in that column).
                  for t in testPanelScreenshots testSettingsPaneScreenshots testClipEditorScreenshots testPaletteScreenshots; do
                      swift test --filter "BeforeScreenshotTests/$t" || echo "::warning::2.2.0 $t reported failures"
                  done
                  count=$(ls "$CLIPPY_SCREENSHOT_DIR" | wc -l)
                  echo "$count"
                  if [ "$count" -lt 30 ]; then echo "::warning::only $count 2.2.0 screenshots were written"; fi

            - name: Download current screenshots
              uses: actions/download-artifact@v8
              with:
                  name: clippy-screenshots
                  path: ${{ runner.temp }}/screenshots

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Compose the comparison
              run: |
                  python3 -m pip install --quiet pillow
                  python3 ci/compare/compose.py \
                      --v220 "$RUNNER_TEMP/v220-shots" \
                      --v240 "$RUNNER_TEMP/v240-shots" \
                      --new "$RUNNER_TEMP/screenshots" \
                      --out "$RUNNER_TEMP/compare"

            - name: Upload comparison
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: clippy-compare
                  path: ${{ runner.temp }}/compare
                  if-no-files-found: warn

            # One unzipped PNG, so a reviewer can open it straight from the run page.
            - name: Upload comparison overview
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  path: ${{ runner.temp }}/compare/compare-overview.png
                  archive: false
                  if-no-files-found: warn

    mcp:
        name: MCP server
        runs-on: macos-26
        steps:
            - uses: actions/checkout@v6.0.3

            # node:sqlite is unflagged from 22.13, which the server depends on.
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Typecheck and smoke-test
              run: |
                  cd integrations/clippy-mcp
                  npm ci --no-audit --no-fund
                  npm run typecheck
                  npm test

            # The plugin ships a vendored copy of the built server. If it drifts
            # from src/, users of the plugin run stale code - which is exactly how
            # the openApi3 schema bug stayed live after being fixed in source.
            #
            # Compared by tool contract rather than by bytes: esbuild embeds each
            # bundled module's resolved path as a comment, so a checkout whose
            # node_modules is a symlink produces a byte-different but identical
            # bundle. See test/bundle-parity.mjs.
            - name: Vendored plugin bundle is in sync
              run: |
                  cd integrations/clippy-mcp
                  node test/bundle-parity.mjs
